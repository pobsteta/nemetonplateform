    briefs: ~/dev/briefs/vers-foretaccess
    fusion: merge    # 11 des 12 dernières PR par commit de fusion (#155 à #165, relevé 2026-11-18) ; #166 (mission 002) fusionnée en squash à tort
  nemetonshiny:
    chemin: ~/dev/nemetonshiny
    depot: pobsteta/nemetonshiny
    chaine: r
    methode: plugin+pilotage   # settings.json versionné (mission 004) ; relevé .claude/ du 2026-11-18
    briefs: ~/dev/briefs/vers-nemetonshiny
    fusion: merge
  nemetonmcp:
    chemin: ~/dev/nemetonmcp
    depot: pobsteta/nemetonmcp
    chaine: r
    methode: plugin            # mission 003 ; relevé .claude/ du 2026-11-18
    briefs: ~/dev/briefs/vers-nemetonmcp
    fusion: squash
  victor:
    chemin: ~/dev/victor/victor
    depot: pobsteta/victor
    chaine: python
    methode: plugin            # mission 006 ; relevé .claude/ du 2026-11-18
    briefs: ~/dev/briefs/vers-victor
    fusion: squash
  aigora:
    chemin: ~/dev/aigora/aigora
    depot: pobsteta/aigora
    chaine: r
    methode: aucune
    observe_seulement: oui   # Pascal, 2026-11-17 : ni plugin ni mission, seulement observé
    briefs: ~/dev/briefs/vers-aigora
    fusion: inconnu   # aucune PR fusionnée ; l'historique ne montre que des fusions de branches locales (relevé 2026-11-18)
  aigora-nemeton:
    chemin: ~/dev/aigora/aigora-nemeton
    depot: null            # dépôt git local sans GitHub ; ne jamais publier (son README.md)
    chaine: r
    methode: aucune
    observe_seulement: oui   # Pascal, 2026-11-17 : ni plugin ni mission, seulement observé
    briefs: ~/dev/briefs/vers-aigora-nemeton
    fusion: null   # pas de dépôt GitHub, donc pas de PR (observé seulement)
  terrain:
    chemin: ~/dev/terrain
    depot: pobsteta/terrain
    chaine: kotlin
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-terrain
    fusion: merge   # relevé 2026-11-18 : #31 à #33 par commit de fusion
  marculus:
    chemin: ~/dev/marculus
    depot: pobsteta/marculus
    chaine: kotlin
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-marculus
    fusion: squash   # relevé 2026-11-18 : #77 à #79 en squash
  surculus:
    chemin: ~/dev/surculus
    depot: pobsteta/surculus
    chaine: kotlin
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-surculus
    fusion: merge   # relevé 2026-11-18 : #178, #181 et #183 par commit de fusion
  ramulus:
    chemin: ~/dev/ramulus
    depot: pobsteta/ramulus
    chaine: kotlin
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-ramulus
    fusion: squash   # squash d'ordinaire (#24, #25), mais #23 par commit de fusion (journal l. 45, écart gardé)
  groma:
    chemin: ~/dev/groma
    depot: pobsteta/groma
    chaine: kotlin+python
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-groma
    fusion: squash
  sylvostation:
    chemin: ~/dev/sylvostation
    depot: pobsteta/sylvostation   # vérifié par gh le 2026-11-17
    chaine: r
    methode: plugin+pilotage   # plugin imperatrice activé dans son dépôt (relevé du 2026-11-17)
    briefs: ~/dev/briefs/vers-sylvostation
    fusion: merge   # relevé 2026-11-18 : #1 à #4 par commit de fusion
  sommieR:
    chemin: ~/dev/sommieR
    depot: pobsteta/sommieR
    chaine: r
    methode: plugin+pilotage   # méthode installée par la mission 011 (PR sommieR #70, 2026-11-17)
    briefs: ~/dev/briefs/vers-sommier
    fusion: squash

