    amont: nemetonshiny
    nature: code-r
    par: "Imports: nemetonshiny (>= 2026.11.2) ; étend son serveur MCP et lit 33 de ses objets internes"
    source: nemetonmcp/r/DESCRIPTION:20 ; nemetonshiny/CONTRAT.md § 6 bis (l. 213)
