# Carte des dépendances de la plateforme Néméton, lisible par une machine.
# Source unique des projets et des liens (docs/spec.md § 8). Propriétaire : l'orchestrateur,
# sur décision de Pascal. Mise à jour : à chaque cycle, quand un lien apparaît ou disparaît.
# Relevé du 2026-11-16 (docs/carte-dependances.md), mis en YAML le 2026-11-17 (mission 007).
# Le schéma, l'état des projets (versions, tags) et les points ouverts restent dans
# docs/carte-dependances.md. Ici : aucun lien nouveau, aucune source inventée.
# Mission 010 (2026-11-17) : les six liens « à confirmer » relus dans le code des deux côtés ;
# deux retirés (voir « Liens retirés » en fin de fichier), quatre laissés à `non` avec une question (un seul le reste au 2026-11-18, voir la note qui suit).
# Note du 2026-11-18 (mission 012) : les quatre questions ont été tranchées par Pascal le
# 2026-11-17 (bilan du cycle 5) ; il ne reste qu'un lien à `non` (nemetonshiny <- sommieR).
# Note du 2026-11-19 : ce dernier lien passe à `oui` (sommieR 0.41.0, mission 021) ; aucun lien à `non`.
# La règle de Pascal du 2026-11-17 « un lien suit la dépendance technique » est en pied de légende.
#
# Lecture : un lien va de l'amont vers l'aval ; un changement en amont peut casser l'aval.
# Les chemins `source:` sont relatifs à ~/dev/ (ou à ~/dev/aigora/ pour aigora-nemeton).
#
# projets.<nom>
#   chemin   : clone local            depot : <propriétaire>/<dépôt> sur GitHub, null si aucun
#   chaine   : r | python | kotlin | kotlin+python
#   methode  : plugin | pilotage | plugin+pilotage | aucune  (méthode de l'Impératrice installée)
#   briefs   : boîte de dépôt des briefs (convention spec § 4) ; le dossier peut ne pas exister
#   branche  : branche par défaut quand ce n'est pas main
#   fusion   : squash | merge | inconnu | null  (convention de fusion des PR vers main, mission 012,
#              relevée le 2026-11-18 ; null = pas de dépôt GitHub, donc pas de PR). Lue par
#              l'orchestrateur avant de fusionner (journal du 2026-11-16, écart sur ramulus #23).
#              Preuves : lignes 45, 55, 56, 66, 68, 78, 88, 132 de pilotage/journal.md, et le
#              nombre de parents du commit de fusion de chaque PR (API GitHub des commits).
# liens[]
#   nature   : code-r | gradle | donnees | mcp | service | brief | git
#   confirme : oui | non  (non = « à confirmer » dans la carte en prose)
#   question : présente sur tout lien `non` : la question précise posée à Pascal
#   test_contrat : test de contrat côté aval qui casse si l'amont change ce que l'aval lit
#                  (missions 014 à 016, 2026-11-18) ; absent = pas encore de test
#   note : précision sur un lien `oui` confirmé par décision ou dont le sens a été fixé par Pascal
#   Règle (Pascal, 2026-11-17) : un lien suit la dépendance technique (l'amont produit ce que l'aval lit), jamais le seul flux des briefs.

projets:
  nemeton:
    chemin: ~/dev/nemeton
    depot: pobsteta/nemeton
    chaine: r
    methode: plugin
    briefs: ~/dev/briefs/vers-nemeton
    fusion: merge
