# Carte des dépendances de la plateforme Néméton, lisible par une machine.
# Source unique des projets et des liens (docs/spec.md § 8). Propriétaire : l'orchestrateur,
# sur décision de Pascal. Mise à jour : à chaque cycle, quand un lien apparaît ou disparaît.
# Relevé du 2026-11-16 (docs/carte-dependances.md), mis en YAML le 2026-11-17 (mission 007).
# Le schéma, l'état des projets (versions, tags) et les points ouverts restent dans
# docs/carte-dependances.md. Ici : aucun lien nouveau, aucune source inventée.
#
# Lecture : un lien va de l'amont vers l'aval ; un changement en amont peut casser l'aval.
# Les chemins `source:` sont relatifs à ~/dev/ (ou à ~/dev/aigora/ pour aigora-nemeton).
#
# projets.<nom>
#   chemin   : clone local            depot : <propriétaire>/<dépôt> sur GitHub, null si aucun
#   chaine   : r | python | kotlin | kotlin+python
#   methode  : plugin | pilotage | plugin+pilotage | aucune  (méthode de l'Impératrice installée)
#   briefs   : boîte de dépôt des briefs (convention spec § 4) ; le dossier peut ne pas exister
#   branche  : branche par défaut quand ce n'est pas main
# liens[]
#   nature   : code-r | gradle | donnees | mcp | service | brief | git
#   confirme : oui | non  (non = « à confirmer » dans la carte en prose)

projets:
  nemeton:
    chemin: ~/dev/nemeton
    depot: pobsteta/nemeton
    chaine: r
    methode: plugin
    briefs: ~/dev/briefs/vers-nemeton
  foretaccess:
    chemin: ~/dev/foretaccess
    depot: pobsteta/foretaccess
    chaine: r
    methode: aucune
    briefs: ~/dev/briefs/vers-foretaccess
  nemetonshiny:
    chemin: ~/dev/nemetonshiny
    depot: pobsteta/nemetonshiny
    chaine: r
    methode: pilotage
    briefs: ~/dev/briefs/vers-nemetonshiny
  nemetonmcp:
    chemin: ~/dev/nemetonmcp
    depot: pobsteta/nemetonmcp
    chaine: r
    methode: aucune
    briefs: ~/dev/briefs/vers-nemetonmcp
  victor:
    chemin: ~/dev/victor/victor
    depot: pobsteta/victor
    chaine: python
    methode: aucune
    briefs: ~/dev/briefs/vers-victor
  aigora:
    chemin: ~/dev/aigora/aigora
    depot: pobsteta/aigora
    chaine: r
    methode: aucune
    briefs: ~/dev/briefs/vers-aigora
  aigora-nemeton:
    chemin: ~/dev/aigora/aigora-nemeton
    depot: null            # dépôt git local sans GitHub ; ne jamais publier (son README.md)
    chaine: r
    methode: aucune
    briefs: ~/dev/briefs/vers-aigora-nemeton
  terrain:
    chemin: ~/dev/terrain
    depot: pobsteta/terrain
    chaine: kotlin
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-terrain
  marculus:
    chemin: ~/dev/marculus
    depot: pobsteta/marculus
    chaine: kotlin
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-marculus
  surculus:
    chemin: ~/dev/surculus
    depot: pobsteta/surculus
    chaine: kotlin
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-surculus
  ramulus:
    chemin: ~/dev/ramulus
    depot: pobsteta/ramulus
    chaine: kotlin
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-ramulus
  groma:
    chemin: ~/dev/groma
    depot: pobsteta/groma
    chaine: kotlin+python
    methode: plugin+pilotage
    briefs: ~/dev/briefs/vers-groma
  sylvostation:
    chemin: null           # pas de clone dans ~/dev
    depot: pobsteta/sylvostation   # vérifié par gh le 2026-11-17
    chaine: r
    methode: pilotage
    briefs: ~/dev/briefs/vers-sylvostation
    branche: claude/admiring-cerf-hq7t8l   # pas de main

